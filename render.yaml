databases:
  - name: recoveros-db
    databaseName: recoveros
    user: postgres
    plan: free

services:
  - type: web
    name: recoveros-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoveros-db
          property: connectionString
      - key: APP_NAME
        value: RecoverOS
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://recoveros-tan.vercel.app
